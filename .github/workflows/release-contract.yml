name: Release contract WASM

on:
  push:
    tags:
      - "contract-v*"

permissions:
  contents: write   # upload the WASM and its SHA-256 as release assets
  id-token: write   # Sigstore-backed build provenance for the attestation
  attestations: write

jobs:
  release:
    name: Build and publish reproducible testnet contract artifact
    runs-on: ubuntu-latest
    container: rust:1.96.0-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install WASM target
        run: rustup target add wasm32v1-none

      - name: Confirm the build is reproducible across checkout paths
        run: bash scripts/check-wasm-reproducibility.sh

      - name: Build contract WASM
        run: bash scripts/build-wasm.sh

      - name: Create SHA-256 file
        run: |
          set -eu
          wasm=contracts/escrow/target/wasm32v1-none/release/docforum_escrow.wasm
          sha256sum "$wasm" | awk '{ print $1 "  docforum_escrow.wasm" }' > docforum_escrow.wasm.sha256

      # Issue #351: tie the published bytes to this workflow run so a reader can
      # verify where and how they were built (`gh attestation verify`), not just
      # rebuild them. Subject path is the exact file uploaded below.
      - name: Attest WASM build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: contracts/escrow/target/wasm32v1-none/release/docforum_escrow.wasm

      - name: Publish WASM and SHA-256 as release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            contracts/escrow/target/wasm32v1-none/release/docforum_escrow.wasm
            docforum_escrow.wasm.sha256
          generate_release_notes: true
