name: Release SDK

on:
  push:
    tags:
      - "sdf-v*"

permissions:
  contents: write   # attach the packed tarball to the GitHub Release
  id-token: write   # npm trusted publishing (OIDC) and the build attestation
  attestations: write

jobs:
  release:
    name: Build, test, and publish the SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref.name }}
        run: |
          set -eu
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED="sdf-v${PKG_VERSION}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION} (expected ${EXPECTED})"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack tarball
        run: npm pack
        id: pack

      # Issue #351: the tarball attached below carries a Sigstore-backed build
      # provenance attestation for this workflow run, verifiable with
      # `gh attestation verify <tarball> -R DocForum/docforum-escrow`.
      - name: Attest SDK tarball build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: sdk/*.tgz

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sdk/*.tgz
          generate_release_notes: true
