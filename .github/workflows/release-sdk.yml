name: Release SDK

on:
  push:
    tags:
      - "sdf-v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, test, and publish the SDK
    runs-on: ubuntu-latest
    # contents: write attaches the release tarball; id-token enables npm
    # trusted publishing and provenance; attestations: write publishes it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: sdk/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref.name }}
        run: |
          set -eu
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED="sdf-v${PKG_VERSION}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION} (expected ${EXPECTED})"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack tarball
        run: npm pack
        id: pack

      # Issue #351: the tarball attached below carries a Sigstore-backed build
      # provenance attestation for this workflow run, verifiable with
      # `gh attestation verify <tarball> -R DocForum/docforum-escrow`.
      - name: Attest SDK tarball build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sdk/*.tgz

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: sdk/*.tgz
          generate_release_notes: true
