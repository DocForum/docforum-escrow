name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Soroban contract (test + wasm build)
    runs-on: ubuntu-latest
    env:
      DOCFORUM_GIT_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a contract version bump when lib.rs changes
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- contracts/escrow/src/lib.rs; then
            exit 0
          fi

          base_version=$(git show "origin/${{ github.base_ref }}:contracts/escrow/src/lib.rs" \
            | sed -nE 's/^pub const CONTRACT_VERSION: &str = "([^"]+)";/\1/p')
          head_version=$(sed -nE 's/^pub const CONTRACT_VERSION: &str = "([^"]+)";/\1/p' \
            contracts/escrow/src/lib.rs)
          if [ -z "$head_version" ] || { [ -n "$base_version" ] && [ "$base_version" = "$head_version" ]; }; then
            echo "contracts/escrow/src/lib.rs changed without a CONTRACT_VERSION bump" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/escrow/Cargo.lock') }}

      - name: cargo test
        run: cargo test

      - name: cargo build --release (wasm)
        run: cargo build --target wasm32v1-none --release

      - name: Confirm wasm artifact exists
        run: test -f target/wasm32v1-none/release/docforum_escrow.wasm

  sdk:
    name: TypeScript SDK (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @stellar/stellar-sdk requires Node >=22.
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Deliberately NOT run here: `npm run test:integration`
      # (tests/testnet-integration.test.ts) — it depends on live testnet
      # + Friendbot funding, a materially different reliability profile
      # than this job's deterministic checks. Run it manually; see that
      # file's own comment for why.
