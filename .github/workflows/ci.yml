name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Soroban contract (test + wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Build escrow WASM for factory integration tests
        run: cargo build --manifest-path contracts/Cargo.toml -p docforum-escrow --target wasm32v1-none --release

      - name: cargo test (contract workspace)
        run: cargo test --manifest-path contracts/Cargo.toml --workspace

      - name: Build factory WASM
        run: cargo build --manifest-path contracts/Cargo.toml -p docforum-escrow-factory --target wasm32v1-none --release

      - name: Confirm both wasm artifacts exist
        run: |
          test -f contracts/target/wasm32v1-none/release/docforum_escrow.wasm
          test -f contracts/target/wasm32v1-none/release/docforum_escrow_factory.wasm

  sdk:
    name: TypeScript SDK (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @stellar/stellar-sdk requires Node >=22.
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Deliberately NOT run here: `npm run test:integration`
      # (tests/testnet-integration.test.ts) — it depends on live testnet
      # + Friendbot funding, a materially different reliability profile
      # than this job's deterministic checks. Run it manually; see that
      # file's own comment for why.
