name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run of the property-based state-machine tests (larger case count).
    - cron: '0 3 * * *'

jobs:
  contract-fuzz:
    name: Contract cargo-fuzz (${{ github.event_name == 'schedule' && 'nightly' || 'PR' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache fuzz build and corpus
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('contracts/escrow/Cargo.lock', 'contracts/escrow/fuzz/Cargo.toml', 'contracts/escrow/fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build lifecycle fuzzer
        working-directory: contracts/escrow
        run: cargo +nightly fuzz build lifecycle

      - name: Run lifecycle fuzzer
        working-directory: contracts/escrow
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            cargo +nightly fuzz run lifecycle -- -max_total_time=600 -timeout=30
          else
            cargo +nightly fuzz run lifecycle -- -max_total_time=30 -timeout=30
          fi

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-fuzz-artifacts-${{ github.run_id }}
          path: contracts/escrow/fuzz/artifacts
          if-no-files-found: ignore

  resource-baseline:
    name: Resource cost baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public function baseline
        run: python3 scripts/check-resource-baseline.py

  contract:
    name: Soroban contract (test + wasm build)
    runs-on: ubuntu-latest
    env:
      DOCFORUM_GIT_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a contract version bump when lib.rs changes
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- contracts/escrow/src/lib.rs; then
            exit 0
          fi

          base_version=$(git show "origin/${{ github.base_ref }}:contracts/escrow/src/lib.rs" \
            | sed -nE 's/^pub const CONTRACT_VERSION: &str = "([^"]+)";/\1/p')
          head_version=$(sed -nE 's/^pub const CONTRACT_VERSION: &str = "([^"]+)";/\1/p' \
            contracts/escrow/src/lib.rs)
          if [ -z "$head_version" ] || { [ -n "$base_version" ] && [ "$base_version" = "$head_version" ]; }; then
            echo "contracts/escrow/src/lib.rs changed without a CONTRACT_VERSION bump" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/escrow/Cargo.lock') }}

      - name: cargo test
        run: cargo test

      - name: cargo test (proptest state-machine, bounded)
        env:
          PROPTEST_CASES: '64'
        run: cargo test --test model -- --nocapture

      - name: cargo test (proptest state-machine, nightly)
        if: github.event_name == 'schedule'
        env:
          PROPTEST_CASES: '4096'
        run: cargo test --test model -- --nocapture

      # Issue #120: test snapshots are committed so events, storage and auth
      # changes show up as reviewable diffs. `cargo test` above rewrites them;
      # any difference from the committed files means the test run produced a
      # snapshot nobody reviewed. Contribution flow: `cargo test`, inspect
      # `git diff contracts/escrow/test_snapshots`, commit intentionally.
      - name: Fail if committed test snapshots changed
        run: |
          set -eu
          if [ -n "$(git status --porcelain -- test_snapshots)" ]; then
            echo "::error::cargo test changed committed Soroban snapshots under contracts/escrow/test_snapshots."
            git status --porcelain -- test_snapshots
            git --no-pager diff -- test_snapshots
            echo "Review the snapshot change (events/storage/auth), then commit it with your change. See CONTRIBUTING.md."
            exit 1
          fi
          echo "Committed test snapshots match this run."

      - name: cargo build --release (wasm)
        run: cargo build --target wasm32v1-none --release

      - name: Confirm wasm artifact exists
        run: test -f target/wasm32v1-none/release/docforum_escrow.wasm

      - name: Test custom releaser account
        run: cargo test --manifest-path ../releaser-account/Cargo.toml

      - name: Build custom releaser account (wasm)
        run: cargo build --manifest-path ../releaser-account/Cargo.toml --target wasm32v1-none --release

      - name: Confirm custom account wasm exists
        run: test -f ../releaser-account/target/wasm32v1-none/release/docforum_releaser_account.wasm

  reproducible-wasm:
    name: Reproducible WASM across checkout paths
    runs-on: ubuntu-latest
    container: rust:1.96.0-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install WASM target
        run: rustup target add wasm32v1-none

      - name: Compare builds from two different checkout paths
        run: bash scripts/check-wasm-reproducibility.sh

  # Issue #121: the committed generated client must match the pinned CLI output.
  sdk-bindings:
    name: SDK bindings match contract WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/escrow/Cargo.lock') }}

      - name: Install pinned Stellar CLI
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' scripts/stellar-cli-version)
          checksum=$(sed -n 's/^linux-x86_64-sha256=//p' scripts/stellar-cli-version)
          url="https://github.com/stellar/stellar-cli/releases/download/v${version}/stellar-cli-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o /tmp/stellar-cli.tar.gz "$url"
          echo "${checksum}  /tmp/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar-cli.tar.gz -C "$HOME/.local/bin"
          "$HOME/.local/bin/stellar" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check generated SDK bindings
        run: ./scripts/check-generated-bindings.sh

  sdk-node:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Type-check the runnable examples against the freshly built dist.
      # NOT executed here: they fund accounts via Friendbot and talk to the
      # live testnet contract (see sdk/examples/README.md) — running them is a
      # manual, testnet-only step, like the SDK's own live suite.
      - run: npm run typecheck:examples

      # Offline only: events fixture decoding plus quorum input validation.
      # Never the live testnet suite (see the note at the end of this file).
      - run: npm run test:offline

      - run: npm run test:milestones

      - run: npm run test:unit

      - run: npm run test:runtime

  sdk-docs:
    name: SDK API reference (TypeDoc + missing-doc lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      # Fails if any exported symbol lacks a doc comment, if a doc link is
      # broken, or if a referenced type is unexpectedly not exported — the
      # "missing-doc lint" (typedoc.json treats these validation warnings as
      # errors). Also proves the reference builds.
      - run: npm run docs

  sdk-bun:
    name: TypeScript SDK (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: bun tests/runtime-smoke.mjs
        working-directory: sdk

  sdk-deno:
    name: TypeScript SDK (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: deno run tests/runtime-smoke.mjs
        working-directory: sdk

  sdk-browser:
    name: TypeScript SDK (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: npx playwright install --with-deps chromium
        working-directory: sdk
      - run: npm run test:browser
        working-directory: sdk

      # Deliberately NOT run here: `npm run test:integration`
      # (tests/testnet-integration.test.ts) depends on live testnet and
      # Friendbot funding. Runtime checks use local fixtures only.

  escrow-react:
    name: React hooks package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            packages/escrow-react/package-lock.json
      # The hooks package resolves the SDK's types from `sdk/dist` via a
      # tsconfig path (the SDK is an optional peer), so build it first.
      - run: npm ci
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: npm ci
        working-directory: packages/escrow-react
      - run: npm run typecheck
        working-directory: packages/escrow-react
      - run: npm test
        working-directory: packages/escrow-react
      - run: npm run build
        working-directory: packages/escrow-react
