name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Soroban contract (test + wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/escrow/Cargo.lock') }}

      - name: cargo test
        run: cargo test

      - name: cargo build --release (wasm)
        run: cargo build --target wasm32v1-none --release

      - name: Confirm wasm artifact exists
        run: test -f target/wasm32v1-none/release/docforum_escrow.wasm

  reproducible-wasm:
    name: Reproducible WASM across checkout paths
    runs-on: ubuntu-latest
    container: rust:1.96.0-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install WASM target
        run: rustup target add wasm32v1-none

      - name: Compare builds from two different checkout paths
        run: bash scripts/check-wasm-reproducibility.sh

  sdk-node:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm run test:fixtures

      - run: npm run test:runtime

  sdk-bun:
    name: TypeScript SDK (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: bun tests/runtime-smoke.mjs
        working-directory: sdk

  sdk-deno:
    name: TypeScript SDK (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
        working-directory: sdk
      - run: npm run build
        working-directory: sdk
      - run: deno run tests/runtime-smoke.mjs
        working-directory: sdk

  sdk-browser:
    name: TypeScript SDK (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
        working-directory: sdk
      - run: npx playwright install --with-deps chromium
        working-directory: sdk
      - run: npm run test:browser
        working-directory: sdk

      # Deliberately NOT run here: `npm run test:integration`
      # (tests/testnet-integration.test.ts) depends on live testnet and
      # Friendbot funding. Runtime checks use local fixtures only.
