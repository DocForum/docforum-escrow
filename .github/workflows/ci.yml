name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here is a required branch-protection check on main (issue #107):
# contract, sdk, fmt, clippy, scout, deny, audit.
#
# Tool versions are pinned deliberately:
# - Rust: 1.91.0 via dtolnay/rust-toolchain and contracts/escrow/rust-toolchain.toml
# - cargo-deny: 0.22.0 (prebuilt release, checksum verified)
# - cargo-audit: 0.23.0 (prebuilt release, checksum verified)
# - Scout: cargo-scout-audit 0.3.17
# Bump any of them in a dedicated PR, after running the gate locally.

jobs:
  contract:
    name: Soroban contract (test + wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/escrow/Cargo.lock', 'contracts/escrow/rust-toolchain.toml') }}

      - name: cargo test
        run: cargo test

      - name: cargo build --release (wasm)
        run: cargo build --target wasm32v1-none --release

      - name: Confirm wasm artifact exists
        run: test -f target/wasm32v1-none/release/docforum_escrow.wasm

  fmt:
    name: Rust formatting (cargo fmt --check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Rust lints (clippy -D warnings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy
          targets: wasm32v1-none
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: ${{ runner.os }}-clippy-${{ hashFiles('contracts/escrow/Cargo.lock', 'contracts/escrow/rust-toolchain.toml') }}
      # Pedantic lints are configured in contracts/escrow/Cargo.toml; the
      # few allowed ones each carry a written reason there.
      - run: cargo clippy --all-targets -- -D warnings

  scout:
    name: Soroban static analysis (Scout)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none

      - name: Cache Scout binary + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-scout-audit
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-scout-0.3.17

      - name: Install pinned Scout
        run: cargo install cargo-scout-audit --version 0.3.17 --locked

      # Excluded detectors, each triaged in docs/supply-chain.md:
      # - soroban-version: we pin soroban-sdk 27.0.6 for ABI compatibility
      #   with the live testnet deployment; the 27 -> 28 upgrade is a
      #   separate breaking contract change (ROADMAP Phase E4 follow-up).
      # - assert-violation: the contract uses Result/Error, never assert!;
      #   the detector only fires on the test suite's assertions.
      # - set-contract-storage: get_status/get_escrow are read-only and must
      #   not require auth; every actual storage write is preceded by
      #   require_auth in the same function.
      - name: Run Scout
        run: |
          mkdir -p scout-report
          cargo scout-audit \
            --output-format md \
            --output-path scout-report/report.md \
            --cicd scout-report \
            --exclude soroban-version,assert-violation,set-contract-storage
          if [ -f scout-report/FAIL ]; then
            echo "Scout reported findings (see the uploaded report artifact)."
            cat scout-report/report.md
            exit 1
          fi

      - name: Upload Scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-report
          path: contracts/escrow/scout-report/report.md
          if-no-files-found: ignore

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Install pinned cargo-deny
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.0/cargo-deny-0.22.0-x86_64-unknown-linux-musl.tar.gz
          echo "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/cargo-deny-0.22.0-x86_64-unknown-linux-musl/cargo-deny" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # deny.toml checks advisories, licenses, duplicate crates and sources.
      # Every suppression/exception in it carries a written reason.
      - run: cargo deny check

  audit:
    name: Supply chain (cargo-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Install pinned cargo-audit
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/cargo-audit.tar.gz" \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz
          echo "b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59  $RUNNER_TEMP/cargo-audit.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/cargo-audit.tar.gz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0/cargo-audit" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Vulnerabilities and yanked crates fail the job. Unmaintained/unsound
      # warnings are printed but do not fail: they all come from
      # soroban-sdk 27.0.6's pinned graph and cannot be fixed here without an
      # SDK bump. The one advisory that is ignored is explained in
      # deny.toml and docs/supply-chain.md, and is ignored here for the same
      # reason.
      - run: cargo audit --deny yanked --ignore RUSTSEC-2026-0387

  sdk:
    name: TypeScript SDK (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @stellar/stellar-sdk requires Node >=22.
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Deliberately NOT run here: `npm run test:integration`
      # (tests/testnet-integration.test.ts) — it depends on live testnet
      # + Friendbot funding, a materially different reliability profile
      # than this job's deterministic checks. Run it manually; see that
      # file's own comment for why.
