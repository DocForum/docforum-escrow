name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Soroban contract (test + wasm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/escrow
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/escrow/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/escrow/Cargo.lock') }}

      - name: cargo test
        run: cargo test

      - name: cargo build --release (wasm)
        run: cargo build --target wasm32v1-none --release

      - name: Confirm wasm artifact exists
        run: test -f target/wasm32v1-none/release/docforum_escrow.wasm

  sdk:
    name: TypeScript SDK (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @stellar/stellar-sdk requires Node >=22.
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Deliberately NOT run here: `npm run test:integration`
      # (tests/testnet-integration.test.ts) — it depends on live testnet
      # + Friendbot funding, a materially different reliability profile
      # than this job's deterministic checks. Run it manually; see that
      # file's own comment for why.
  sdk-python:
    name: Python SDK (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline unit tests
        run: pytest -q

      # Deliberately NOT run here: the testnet integration test
      # (tests/testnet_integration.py) — it depends on live testnet +
      # Friendbot funding, a materially different reliability profile
      # than this job's deterministic checks. Run it manually; see that
      # file's own comment for why.
