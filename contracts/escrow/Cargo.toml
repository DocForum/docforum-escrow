[package]
name = "docforum-escrow"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "27.0.6", features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
ed25519-dalek = "2"
proptest = "1.5"

[[bench]]
name = "resource_profile"
harness = false

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true